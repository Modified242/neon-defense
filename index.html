<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Defense</title>
    <meta name="description" content="A custom 2D tower defense game with modern neon aesthetics." />
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="game-container">
      <header class="game-header glass-panel">
        <div class="stats">
          <div class="stat-box"><span class="label">Lives</span> <span id="lives-display">50</span></div>
          <div class="stat-box"><span class="label">Credits</span> <span id="credits-display">300</span></div>
          <div class="stat-box"><span class="label">Wave</span> <span id="wave-display">1</span></div>
          <div class="controls-group" style="display: flex; align-items: center; gap: 8px; margin-left: 20px;">
            <button id="pause-btn" class="glow-btn small-btn">⏸</button>
            <button id="speed-1-btn" class="glow-btn small-btn speed-btn active-speed">1x</button>
            <button id="speed-2-btn" class="glow-btn small-btn speed-btn">2x</button>
            <button id="speed-3-btn" class="glow-btn small-btn speed-btn">3x</button>
          </div>
          <button id="fullscreen-btn" class="glow-btn small-btn" style="margin-left: auto;">⛶ Fullscreen</button>
        </div>
        <h1 class="title">NEON DEFENSE</h1>
        <button id="start-wave-btn" class="glow-btn">Start Wave</button>
      </header>

      <main class="game-area">
          <div class="canvas-container">
            <canvas id="game-canvas" width="800" height="600"></canvas>
            
            <div id="level-select-screen" class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 40px; margin-top: -20px;">
                    <div style="font-size: 1.2rem; color: #3b82f6; font-weight: bold;">
                        Data Cores: <span id="data-cores-display">0</span>
                    </div>
                    <h2>SELECT SECTOR</h2>
                    <button id="tech-lab-btn" class="glow-btn" style="background: linear-gradient(135deg, #10b981, #0ea5e9);">Tech Lab</button>
                </div>
                <div id="level-buttons" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 30px;">
                    <!-- JS will populate these -->
                </div>
            </div>

            <div id="tech-tree-screen" class="hidden glass-panel" style="flex-direction: column; justify-content: flex-start; padding-top: 40px;">
                <div style="display: flex; justify-content: space-between; width: 80%; max-width: 600px; margin-bottom: 20px;">
                    <h2>TECH LAB</h2>
                    <div style="font-size: 1.4rem; color: #3b82f6; font-weight: bold; align-self: center;">
                        Cores: <span id="tech-cores-display">0</span>
                    </div>
                </div>
                <div id="tech-list" style="display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 600px; overflow-y: auto; max-height: 400px; padding: 10px;">
                    <!-- JS will populate -->
                </div>
                <button id="close-tech-btn" class="glow-btn" style="margin-top: 30px; background: linear-gradient(135deg, #475569, #1e293b);">Back</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel">
                <h2>SYSTEM FAILURE</h2>
                <p id="game-over-detail" class="overlay-detail"></p>
                <div style="display: flex; gap: 10px;">
                    <button id="restart-btn" class="glow-btn">Reboot System</button>
                    <button id="fail-menu-btn" class="glow-btn" style="background: linear-gradient(135deg, #475569, #1e293b);">Menu</button>
                </div>
            </div>
            <div id="victory-screen" class="hidden glass-panel">
                <h2>DEFENSE SUCCESSFUL</h2>
                <div style="display: flex; gap: 10px;">
                    <button id="endless-btn" class="glow-btn" style="background: linear-gradient(135deg, #10b981, #047857);">Endless</button>
                    <button id="next-level-btn" class="glow-btn">Next Level</button>
                    <button id="win-menu-btn" class="glow-btn" style="background: linear-gradient(135deg, #475569, #1e293b);">Menu</button>
                </div>
            </div>
        </div>
        <aside class="tower-menu glass-panel">
          <div id="build-menu">
            <h2>Towers</h2>
            <div class="tower-list">
              <button class="tower-btn" data-type="basic" data-cost="50">
                <div class="tower-icon basic-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Pulse Blaster</span>
                  <span class="tower-cost">50 ¢</span>
                </div>
              </button>
              <button class="tower-btn" data-type="sniper" data-cost="100">
                <div class="tower-icon sniper-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Railgun (Sniper)</span>
                  <span class="tower-cost">100 ¢</span>
                </div>
              </button>
              <button class="tower-btn" data-type="rapid" data-cost="150">
                <div class="tower-icon rapid-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Plasma Repeater</span>
                  <span class="tower-cost">150 ¢</span>
                </div>
              </button>
              <button class="tower-btn" data-type="frost" data-cost="120">
                <div class="tower-icon frost-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Cryo Emitter</span>
                  <span class="tower-cost">120 ¢</span>
                </div>
              </button>
              <button class="tower-btn" data-type="blast" data-cost="200">
                <div class="tower-icon blast-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Photon Mortar</span>
                  <span class="tower-cost">200 ¢</span>
                </div>
              </button>
              <button class="tower-btn" data-type="laser" data-cost="180">
                <div class="tower-icon laser-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Ion Beam</span>
                  <span class="tower-cost">180 ¢</span>
                </div>
              </button>
              <button class="tower-btn" data-type="support" data-cost="250">
                <div class="tower-icon support-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Overclock Node</span>
                  <span class="tower-cost">250 ¢</span>
                </div>
              </button>
              <button class="tower-btn" data-type="generator" data-cost="150">
                <div class="tower-icon generator-icon"></div>
                <div class="tower-info">
                  <span class="tower-name">Credit Fabricator</span>
                  <span class="tower-cost">150 ¢</span>
                </div>
              </button>
            </div>
            <div id="preview-panel" class="instructions" style="min-height: 140px;">
              <p>Select a tower and click on the grid to place it.</p>
              <p>Don't let the neon shapes reach the end!</p>
            </div>
          </div>

          <div id="upgrade-menu" class="hidden" style="display: flex; flex-direction: column; gap: 15px; height: 100%;">
            <h2>Tower Mgmt</h2>
            <div id="selected-tower-stats" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; flex-grow: 1;">
               <!-- Stats populated by JS -->
            </div>
            <div id="targeting-controls" style="margin-bottom: 10px;">
              <label for="targeting-mode" style="display: block; margin-bottom: 5px; font-weight: bold; color: #cbd5e1;">Targeting:</label>
              <select id="targeting-mode" style="width: 100%; padding: 8px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #3b82f6; border-radius: 4px; outline: none; cursor: pointer;">
                <option value="first">First (Closest to Core)</option>
                <option value="strong">Strong (Highest HP)</option>
                <option value="weak">Weak (Lowest HP)</option>
                <option value="close">Close (Nearest to Tower)</option>
              </select>
            </div>
            <button id="upgrade-btn" class="glow-btn">Upgrade (<span id="upgrade-cost">--</span>¢)</button>
            <button id="sell-btn" class="glow-btn" style="background: linear-gradient(135deg, #ef4444, #991b1b); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);">Sell (<span id="sell-price">--</span>¢)</button>
            <button id="close-upgrade-btn" class="glow-btn" style="background: linear-gradient(135deg, #475569, #1e293b); box-shadow: none;">Back</button>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
